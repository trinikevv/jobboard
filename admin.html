<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - EdoState Jobs</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="admin-body">
    <aside class="admin-sidebar">
      <div class="sidebar-logo">
        <i class="fas fa-shield-halved"></i>
        <span>EdoState<strong>Admin</strong></span>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link active" data-section="overview"
          ><i class="fas fa-chart-line"></i> <span>Overview</span></a
        >
        <a href="#" class="sidebar-link" data-section="applications"
          ><i class="fas fa-file-lines"></i> <span>Applications</span>
          <span class="sidebar-badge" id="appBadge">0</span></a
        >
        <a href="#" class="sidebar-link" data-section="jobs"
          ><i class="fas fa-briefcase"></i> <span>Jobs</span></a
        >
        <a href="#" class="sidebar-link" data-section="students"
          ><i class="fas fa-user-graduate"></i> <span>Students</span></a
        >
        <a href="#" class="sidebar-link" data-section="settings"
          ><i class="fas fa-gear"></i> <span>Settings</span></a
        >
      </nav>

      <div class="sidebar-footer">
        <a href="home.html" class="sidebar-link small"
          ><i class="fas fa-arrow-left"></i> <span>Back to Site</span></a
        >
        <a href="#" class="sidebar-link small logout" onclick="adminLogout()"
          ><i class="fas fa-right-from-bracket"></i> <span>Logout</span></a
        >
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSubtitle">Welcome back, Admin</p>
        </div>
        <div class="topbar-right">
          <span class="admin-badge-large"
            ><i class="fas fa-user-shield"></i> Administrator</span
          >
        </div>
      </header>
      <div class="admin-content" id="adminContent"></div>
    </main>

    <script src="js/jobs-data.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
