<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply - EdoState Jobs</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">EdoState<span>Jobs</span></div>
      <div class="mobile-menu-toggle" onclick="toggleMobileMenu()">
        <i class="fas fa-bars"></i>
      </div>
      <nav class="nav-links" id="mainNavLinks">
        <a href="home.html">Home</a>
        <a href="index.html">Find Jobs</a>
        <a href="about.html">About</a>
        <a href="faq.html">FAQ</a>
        <a href="admin-login.html" class="admin-icon-link" title="Admin Login"
          ><i class="fas fa-user-cog"></i
        ></a>
      </nav>
    </header>

    <div class="breadcrumb-container">
      <a href="#" id="backToJobLink" class="back-link"
        ><i class="fas fa-arrow-left"></i> Back to Job Details</a
      >
    </div>

    <main class="main-content">
      <div class="form-wrapper" id="formWrapper">
        <div class="form-header">
          <h2>Application Form</h2>
          <p>Applying for: <strong id="applyJobTitle">Loading...</strong></p>
        </div>

        <form id="applicationForm" class="application-form">
          <div class="form-row">
            <div class="form-group">
              <label for="fullname">Full Name *</label>
              <input
                type="text"
                id="fullname"
                readonly
                style="background: #f0f0f0; cursor: not-allowed"
              />
            </div>
            <div class="form-group">
              <label for="email">Email Address *</label>
              <input
                type="email"
                id="email"
                readonly
                style="background: #f0f0f0; cursor: not-allowed"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone Number *</label>
              <input
                type="tel"
                id="phone"
                placeholder="e.g. 08012345678"
                required
              />
            </div>
            <div class="form-group">
              <label for="school">Institution *</label>
              <input
                type="text"
                id="school"
                placeholder="e.g. University of Benin"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="course">Course *</label>
              <input
                type="text"
                id="course"
                placeholder="e.g. Computer Science"
                required
              />
            </div>
            <div class="form-group">
              <label for="cv_link">CV Link *</label>
              <input
                type="url"
                id="cv_link"
                placeholder="https://drive.google.com/..."
                required
              />
            </div>
          </div>

          <div class="form-group full-width">
            <label for="cover_message">Cover Message *</label>
            <textarea
              id="cover_message"
              rows="5"
              maxlength="500"
              required
              placeholder="Briefly tell us why you are interested... (Max 500 characters)"
            ></textarea>
            <div
              style="
                text-align: right;
                font-size: 12px;
                color: #888;
                margin-top: 5px;
              "
            >
              <span id="charCount">0</span> / 500
            </div>
          </div>

          <button type="submit" class="btn-submit">
            <i class="fas fa-paper-plane"></i> Submit Application
          </button>
        </form>
      </div>

      <div
        id="successMessage"
        class="form-wrapper"
        style="display: none; text-align: center; padding: 50px 20px"
      ></div>
    </main>

    <footer>
      <p>&copy; 2026 Edo State Government ICT Internship Scheme.</p>
    </footer>

    <script src="js/jobs-data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/apply.js"></script>
  </body>
</html>
